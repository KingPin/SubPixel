name: CI

on:
  push:
    branches: [main]
  pull_request:

# Checkout, build, test. Nothing here needs write access, and an unscoped token
# in a workflow that runs on every pull_request is the one worth narrowing.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["24", "26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
